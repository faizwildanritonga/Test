<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0c16" />
<title>Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0c16; --text:#eef0ff; --muted:#9aa1c7; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.055); --p1:#7c5cff; --p2:#22d3ee; --err:#ff6b7a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; display:grid; place-items:center; padding:32px 16px;
  font-family:var(--font); color:var(--text); line-height:1.55; overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(34,211,238,.16), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;z-index:0;animation:melayang 14s ease-in-out infinite}
.orb.o1{width:340px;height:340px;background:var(--p1);top:-90px;left:-70px}
.orb.o2{width:300px;height:300px;background:var(--p2);bottom:-90px;right:-60px;animation-delay:-7s}
@keyframes melayang{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,22px)}}

.mono{font-family:var(--mono)}
.bungkus{position:relative;z-index:1;width:100%;max-width:420px}
.bungkus.lebar{max-width:780px}

.kepala-app{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 24px rgba(124,92,255,.45)}
.logo svg{width:22px;height:22px;stroke:#fff}
.judul-app{font-weight:700;font-size:17px;letter-spacing:-.01em}

.ledger{
  background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:32px;margin-bottom:18px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  animation:masuk .5s ease both;
}
@keyframes masuk{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ledger h2{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
.ledger p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.ledger p:last-child{margin-bottom:0}
.sub{margin-bottom:26px !important}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:#cfd3f3;margin-bottom:8px}
.input-wrap{position:relative}
.input-wrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);pointer-events:none;transition:stroke .2s}
.input-wrap:focus-within>svg{stroke:var(--p2)}
.field input{
  width:100%;height:50px;padding:0 46px 0 44px;font:inherit;font-size:15px;color:var(--text);
  background:rgba(8,10,22,.55);border:1px solid var(--line);border-radius:14px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input::placeholder{color:#6a7099}
.field input:hover{border-color:rgba(255,255,255,.22)}
.field input:focus{outline:none;border-color:var(--p1);box-shadow:0 0 0 4px rgba(124,92,255,.22);background:rgba(8,10,22,.8)}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;
  background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.toggle:hover{background:rgba(255,255,255,.08);color:#fff}
.toggle svg{width:19px;height:19px;stroke:currentColor}
.toggle .garis{display:none}
.toggle.on .garis{display:inline}

.tombol{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;padding:0 22px;
  font:inherit;font-size:15px;font-weight:600;color:#fff;text-decoration:none;cursor:pointer;
  border:0;border-radius:14px;background:linear-gradient(135deg,var(--p1),#5b8cff 55%,var(--p2));
  box-shadow:0 10px 28px rgba(124,92,255,.4);transition:transform .15s,box-shadow .2s,filter .2s;
}
.tombol:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(124,92,255,.55);filter:brightness(1.06)}
.tombol:active{transform:translateY(0)}
.tombol:focus-visible,.toggle:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.tombol:disabled{cursor:progress;opacity:.8;transform:none}
.tombol:disabled::before{content:"";width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:putar .7s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.tombol.sekunder{width:auto;background:var(--glass);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.tombol.sekunder:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);box-shadow:none}
.tombol.kecil{height:38px;padding:0 16px;font-size:13.5px;border-radius:11px}
.aksi{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

.status{padding:13px 16px;border-radius:14px;font-size:14px;margin-bottom:18px;animation:masuk .3s ease both}
.status.gagal{background:rgba(255,107,122,.12);color:#ffb3bb;border:1px solid rgba(255,107,122,.35);border-left:4px solid var(--err)}
.status.proses{background:rgba(250,204,21,.1);color:#fde68a;border:1px solid rgba(250,204,21,.3)}
#hasil-area:empty{display:none}

.alt{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 0}
a{color:#a99bff;text-decoration:none;font-weight:500}
a:hover{color:var(--p2)}

.selamat-datang{text-align:center;padding:44px 28px}
.badge{width:68px;height:68px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 0 0 8px rgba(124,92,255,.15),0 12px 32px rgba(124,92,255,.45)}
.badge svg{width:32px;height:32px;stroke:#fff}
.selamat-datang h1{font-size:30px;letter-spacing:-.02em;margin:0 0 8px;
  background:linear-gradient(135deg,#fff,#b9b0ff 60%,#8fe9f7);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}

#tabel-area .ledger{padding:10px 18px;overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}
table.data tr:last-child td{border-bottom:0}
table.data th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
table.data tr:not(:first-child):hover td{background:rgba(255,255,255,.04)}
table.data td.hex{font-family:var(--mono);color:#7ee7f6}

.catatan-kaki{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
.catatan-kaki a{color:var(--muted)}.catatan-kaki a:hover{color:var(--p2)}

@media (max-width:480px){
  body{padding:20px 14px;align-items:start}
  .ledger{padding:24px 20px;border-radius:20px}
  .ledger h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<main class="bungkus">
  <header class="kepala-app">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span><span class="judul-app">Portal Kelas (Kombinatorik) </span></div>
  </header>

  <div class="ledger">
    <h2>Selamat datang kembali</h2>
    <p class="sub">Masuk untuk melanjutkan ke portal.</p>
    <form id="form-login">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required />
          <button type="button" class="toggle" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="garis" d="M4 4l16 16"/></svg></button>
        </div>
      </div>
      <button type="submit" class="tombol" id="btn-login">Masuk</button>
    </form>
  </div>

  <div id="hasil-area"></div>

  <p class="alt">
    Belum punya akun? <a href="daftar.html">Daftar di sini</a>
  </p>
</main>

<script src="hash.js"></script>
<script type="module" src="app-login.js"></script>
<script>
document.querySelectorAll(".toggle").forEach(function (b) {
  b.addEventListener("click", function () {
    var i = b.parentElement.querySelector("input");
    var tampil = i.type === "password";
    i.type = tampil ? "text" : "password";
    b.classList.toggle("on", tampil);
    b.setAttribute("aria-label", tampil ? "Sembunyikan password" : "Tampilkan password");
  });
});
</script>
</body>
</html>
